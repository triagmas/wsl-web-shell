<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
    <title>Updating DeepSeek Harness</title>
    <link rel="stylesheet" href="update.css" />
  </head>
  <body class="progress-page">
    <main>
      <h1 id="heading">Updating DeepSeek Harness</h1>
      <p class="status" id="status">Starting…</p>
      <pre id="terminal" class="terminal" tabindex="0" aria-live="polite" aria-label="Update output"></pre>
      <p class="detail" id="detail" hidden></p>
      <div class="actions">
        <button type="button" id="close" class="secondary" disabled>Close</button>
      </div>
    </main>
    <script src="progress.js"></script>
  </body>
</html>
