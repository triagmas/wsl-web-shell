name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build main/preload/local pages
        run: npm run build

      # Renders the app-owned footer and settings popover under Xvfb and asserts
      # what they show (issue #9). No WSL and no DeepSeek Harness involved.
      - name: Chrome smoke (footer + settings popover)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm run chrome:smoke

      # Builds the real Windows/WebContentsView composition against a local test
      # server: bar geometry, WebUI bounds, resize and session continuity.
      - name: Composition smoke (real window + view)
        run: npm run composition:smoke

      # Reads the pixels the operating system really shows: geometry and DOM can
      # both be right while the remote surface stays invisible (issue #11).
      - name: Composition paint probe (real screen pixels)
        run: npm run paint:probe:xvfb

      - name: Upload paint probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-paint-probe
          path: paint-probe
          retention-days: 7

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-build
          path: dist
          retention-days: 7

  # Issue #11 regression: on a real Windows desktop session the remote WebUI
  # surface must actually be visible above the footer bar. Runs on its own so a
  # composition failure is reported even when other jobs are red.
  windows-paint:
    name: Windows composition paint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Composition paint probe (Windows desktop)
        run: npm run paint:probe -- --out paint-probe

      - name: Upload paint probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-paint-probe
          path: paint-probe
          retention-days: 7

  windows-package:
    name: Windows x64 portable package
    runs-on: windows-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify again on Windows
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Package portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Record artifact hash
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'WSL-Web-Shell-*-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'portable EXE was not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "artifact=$($exe.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "$hash  $($exe.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Encoding ascii

      - name: Packaged relaunch check (issue #12)
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'WSL-Web-Shell-*-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'portable EXE was not produced' }
          $dir = Join-Path $env:RUNNER_TEMP 'relaunch-probe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Write-Host "probing $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -ArgumentList "--relaunch-probe=$dir" -Wait
          node scripts/check-relaunch.cjs $dir $exe.FullName 180

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: wsl-web-shell-windows-x64
          path: |
            release/WSL-Web-Shell-*-x64.exe
            release/SHA256SUMS.txt
          retention-days: 7
